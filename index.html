<div class="ost-settings-wrapper" style="padding: 10px;">
    <h4>🎵 OST Music-player</h4>
    
    <!-- 【新增】模式切换开关 -->
    <div style="display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #3f3f46; padding-bottom: 10px;">
        <div id="ost-mode-direct" class="menu_button" style="flex: 1; text-align: center; background: rgba(168, 85, 247, 0.2); border: 1px solid #a855f7;">🔗 直链歌单</div>
        <div id="ost-mode-iframe" class="menu_button" style="flex: 1; text-align: center; opacity: 0.5;">🌐 线上外链</div>
    </div>

    <!-- ================= 直链模式 UI (默认显示) ================= -->
    <div id="ost-direct-ui">
        <!-- 1. 新增歌曲区 -->
        <p style="font-size: 12px; color: #a1a1aa; margin-bottom: 5px;">添加新歌曲 (通过url)：</p>
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" id="ost-new-link" class="text_pole" style="flex: 1; padding: 5px;" placeholder="粘贴单行或多行链接...">
            <div id="ost-add-btn" class="menu_button" style="width: auto; padding: 0 15px; display: flex; align-items: center;">➕ 添加</div>
        </div>

        <!-- 2. 排序工具栏 -->
        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
            <div class="menu_button ost-sort-btn" data-sort="az" title="按字母 A-Z 排序" style="flex:1; text-align:center; font-size:12px;">A-Z</div>
            <div class="menu_button ost-sort-btn" data-sort="za" title="按字母 Z-A 排序" style="flex:1; text-align:center; font-size:12px;">Z-A</div>
            <div class="menu_button ost-sort-btn" data-sort="reverse" title="列表倒序反转" style="flex:1; text-align:center; font-size:12px;">🔃反转</div>
            <div class="menu_button ost-sort-btn" data-sort="random" title="随机打乱列表" style="flex:1; text-align:center; font-size:12px;">🔀打乱</div>
        </div>

        <!-- 3. 可拖拽列表容器 -->
        <ul id="ost-playlist-container" style="list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; border: 1px solid #3f3f46; border-radius: 6px; background: #18181b;">
            <!-- 列表项会由 JS 动态生成填充这里 -->
        </ul>
    </div>

    <!-- ================= 线上外链模式 UI (默认隐藏) ================= -->
    <div id="ost-iframe-ui" style="display: none;">
        <p style="font-size: 12px; color: #a1a1aa; margin-bottom: 5px;">粘贴网易云/B站的外链代码 (iframe)：</p>
        <textarea id="ost-iframe-input" class="text_pole" style="width: 100%; height: 100px; padding: 8px; font-family: monospace; font-size: 11px; resize: vertical;" placeholder='例如: <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width=330 height=86 src="//music.163.com/outchain/player?type=2&id=xxx&auto=1&height=66"></iframe>'></textarea>
        <p style="font-size: 10px; color: #a855f7; margin-top: 8px;">⚠️ 提示：启用外链时，悬浮窗的按键将被隐藏，请直接操作内嵌的官方播放器。</p>
    </div>
    
    <!-- 4. 保存按钮 (双模通用) -->
    <div id="ost-save-btn" class="menu_button" style="margin-top: 15px; text-align: center;">💾 保存并应用</div>
</div>
